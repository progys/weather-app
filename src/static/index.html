<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tomorrow's Weather — Vilnius</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    main {
      max-width: 420px;
      margin: 4rem auto;
      padding: 0 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 2rem; color: #1a1a2e; }
    .loading, .error { font-size: 1.1rem; padding: 2rem; }
    .error { color: #e74c3c; }
    .card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 1rem;
      padding: 2rem;
      color: white;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .location { font-size: 1.2rem; font-weight: 600; opacity: 0.9; }
    .date { font-size: 0.85rem; opacity: 0.75; margin-bottom: 1.5rem; }
    .emoji { font-size: 4rem; margin: 0.5rem 0; }
    .condition { font-size: 1.1rem; margin-bottom: 1rem; opacity: 0.9; }
    .temps {
      display: flex; justify-content: center; gap: 2rem;
      font-size: 1.4rem; font-weight: 600; margin-bottom: 1.5rem;
    }
    .high { color: #ffd93d; }
    .low { color: #a8d8ea; }
    .details {
      display: flex; justify-content: center; gap: 2rem;
      padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.2);
    }
    .detail { display: flex; flex-direction: column; gap: 0.25rem; }
    .label {
      font-size: 0.75rem; opacity: 0.7;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .value { font-size: 1rem; font-weight: 500; }
    footer { margin-top: 2rem; font-size: 0.8rem; color: #888; }
    footer a { color: #667eea; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Tomorrow's Weather</h1>
    <div id="app"><p class="loading">Loading forecast...</p></div>
    <footer>
      Powered by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
      &bull; Compiled as a standalone binary with <a href="https://bun.sh/" target="_blank" rel="noopener">Bun</a>
    </footer>
  </main>
  <script>
    const descriptions = {
      0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
      45:'Foggy',48:'Depositing rime fog',51:'Light drizzle',53:'Moderate drizzle',
      55:'Dense drizzle',61:'Slight rain',63:'Moderate rain',65:'Heavy rain',
      71:'Slight snowfall',73:'Moderate snowfall',75:'Heavy snowfall',
      80:'Slight rain showers',81:'Moderate rain showers',82:'Violent rain showers',
      95:'Thunderstorm',96:'Thunderstorm with slight hail',99:'Thunderstorm with heavy hail'
    };
    const emojis = {
      0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',
      55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',
      80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'
    };
    function formatDate(s) {
      return new Date(s + 'T00:00:00').toLocaleDateString('en-US',
        { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    }
    fetch('/api/weather')
      .then(r => r.json())
      .then(d => {
        if (d.error) { document.getElementById('app').innerHTML = '<p class="error">Error: ' + d.error + '</p>'; return; }
        const code = d.daily.weathercode[0];
        document.getElementById('app').innerHTML =
          '<div class="card">' +
          '<div class="location">' + d.location.name + '</div>' +
          '<div class="date">' + formatDate(d.date) + '</div>' +
          '<div class="emoji">' + (emojis[code] || '🌡️') + '</div>' +
          '<div class="condition">' + (descriptions[code] || 'Unknown') + '</div>' +
          '<div class="temps">' +
          '<span class="high">↑ ' + d.daily.temperature_2m_max[0] + '°C</span>' +
          '<span class="low">↓ ' + d.daily.temperature_2m_min[0] + '°C</span>' +
          '</div>' +
          '<div class="details">' +
          '<div class="detail"><span class="label">Precipitation</span><span class="value">' + d.daily.precipitation_sum[0] + ' mm</span></div>' +
          '<div class="detail"><span class="label">Max Wind</span><span class="value">' + d.daily.wind_speed_10m_max[0] + ' km/h</span></div>' +
          '</div></div>';
      })
      .catch(e => { document.getElementById('app').innerHTML = '<p class="error">' + e.message + '</p>'; });
  </script>
</body>
</html>
